[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
description = "Institutional-grade multi-agent equity research system built with StateGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "yfinance>=1.7.0",
    "newsapi-python>=0.2.7",
    "alpha-vantage>=3.0.0",
    "fredapi>=0.5.2",
    "pandas>=3.0.6",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
research-agent = "research_agent.workflows.session:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# PEP 8 (E, W, N), PEP 257 docstrings (D, Google convention), type hints (ANN), plus
# bug-prone patterns, lazy logging, test style and security checks.
select = [
    "E", "W", "F", "I", "N", "D", "UP", "B", "C4", "SIM", "ANN", "BLE", "G", "RET",
    "PT", "ARG", "ERA", "PIE", "PERF", "PL", "RUF", "S", "TRY",
]
ignore = [
    "D105",     # magic methods are self-explanatory
    "D107",     # __init__ arguments are documented on the method or the class
    "D205",     # module headers use a "path / ====" title block
    "D212",     # Google style: summary on the line after the opening quotes is allowed
    "D400",     # summary line may end with ":" or ")" in examples
    "D415",
    "ANN401",   # Any is deliberate where provider SDK objects are passed through
    "PLC0415",  # local imports are used on purpose for optional/heavy dependencies
    "PLR0913",  # agent factories and constructors take many optional settings
    "PLR0917",  # constructors and formatters take many settings
    "PLR2004",  # small literals in formatting code are clearer inline
    "TRY003",   # descriptive messages in raise statements are preferred here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "D", "PLR2004", "ARG"]
"*.ipynb" = ["D", "ANN", "E402", "T20", "S", "ERA", "BLE", "PLR"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
]
